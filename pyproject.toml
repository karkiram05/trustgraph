[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustgraph"
version = "0.1.0"
description = "Attack-path analysis for CI/CD identities and cloud trust relationships"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "networkx>=3.2",
    "click>=8.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "bandit>=1.8",
    "pip-audit>=2.9",
]

[project.scripts]
trustgraph = "trustgraph.cli.main:cli"

[tool.setuptools.packages.find]
include = ["trustgraph*"]
