name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install package (editable, for the console script + package imports)
        run: pip install -e .

      - name: Run tests
        run: python -m pytest -v

      - name: Sanity-check the CLI against the example fixtures
        run: |
          trustgraph scan examples/vulnerable-project --repo-name my-org/vulnerable-project --json /tmp/vuln.json
          test "$(python -c "import json; print(len(json.load(open('/tmp/vuln.json'))))")" -gt 0
          trustgraph scan examples/hardened-project --repo-name my-org/hardened-project | grep -q "No findings"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install security tooling
        run: pip install bandit pip-audit

      - name: Bandit (static analysis for common security issues)
        run: bandit -r trustgraph -q

      - name: pip-audit (known-vulnerable dependency scan)
        # Fails on any advisory with a fix available. A finding with no fix
        # yet gets an explicit `--ignore-vuln <id>` with a re-check date,
        # not a blanket `|| true`.
        run: pip-audit -r requirements.txt
